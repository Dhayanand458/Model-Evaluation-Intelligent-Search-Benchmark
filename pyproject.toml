[project]
name = "triage-mcp"
version = "0.1.0"
description = "Issue-triage MCP server: ingest GitHub issues, embed them, evaluate retrieval, serve tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pandas==3.0.3",
    "pyarrow==25.0.0",
    "numpy==2.4.6",
    "sentence-transformers==5.6.0",
    # ONNX backend for the same model. sentence-transformers needs torch, whose
    # unsigned DLLs are blocked outright by Windows Smart App Control; these two
    # run all-MiniLM-L6-v2 without it. See store.embed_texts.
    "onnxruntime==1.27.0",
    "tokenizers==0.22.2",
    "scikit-learn==1.9.0",
    # Imported directly to persist the fitted classifier; pinned rather than
    # relied on as a transitive scikit-learn dependency.
    "joblib==1.5.2",
    "matplotlib==3.11.1",
    "mcp==1.28.1",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: spawns the MCP server as a subprocess and needs built data/ artefacts",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN401"]
